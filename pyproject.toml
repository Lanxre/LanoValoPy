[project]
name = "LanoValoPy"
version = "1.1.0"
description = "This is a wrapper for the Valorant API, source: https://github.com/henrikdev/valorant-api"
authors = [{ name = "Lanxre", email = "73068449+Lanxre@users.noreply.github.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.9.2,<3",
    "aiohttp>=3.10.10,<4",
    "asyncio>=3.4.3,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9",
    "pytest-asyncio>=0.24.0,<0.25",
    "pydantic-settings>=2.6.1,<3",
    "sphinx>=8.1.3,<9",
    "sphinx-rtd-theme>=3.0.1,<4",
    "sphinx-autodoc-typehints>=2.5.0,<3",
    "autodocsumm>=0.2.14,<0.3",
    "mypy>=1.15.0,<2",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["lano_valo_py"]
module-root = ""

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
